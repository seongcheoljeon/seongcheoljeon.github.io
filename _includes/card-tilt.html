<!-- Post Card 3D Hover Effect -->
<style>
  .post-preview {
    transform-style: preserve-3d;
    transition: transform 0.15s ease, box-shadow 0.15s ease !important;
  }

  /* 호버 중에만 GPU 레이어 점유 (상시 will-change 는 카드 수만큼 레이어를 잡아먹음) */
  .post-preview:hover {
    will-change: transform;
  }
</style>

<script>
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const MAX_TILT = 8;        /* 최대 기울기 각도 (deg) */
    const SCALE   = 1.03;      /* 호버 시 확대 비율 */

    function resetTilt(card) {
      card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) scale(1)';
    }

    function bindCard(card) {
      let rect = null;

      card.addEventListener('mouseenter', function () {
        rect = card.getBoundingClientRect();
      });

      card.addEventListener('mousemove', function (e) {
        if (!rect) return;
        const cx   = rect.left + rect.width  / 2;
        const cy   = rect.top  + rect.height / 2;
        const dx   = (e.clientX - cx) / (rect.width  / 2);
        const dy   = (e.clientY - cy) / (rect.height / 2);
        const rotX = -dy * MAX_TILT;
        const rotY =  dx * MAX_TILT;
        card.style.transform = 'perspective(800px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg) scale(' + SCALE + ')';
      }, { passive: true });

      card.addEventListener('mouseleave', function () {
        rect = null;
        resetTilt(card);
      });

      /* rect 는 viewport 상대 좌표라 스크롤하면 낡는다 — 호버 중일 때만 갱신 */
      window.addEventListener('scroll', function () {
        if (rect) rect = card.getBoundingClientRect();
      }, { passive: true });
    }

    function init() {
      document.querySelectorAll('.post-preview').forEach(bindCard);
    }

    /* 초기 바인딩 */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
