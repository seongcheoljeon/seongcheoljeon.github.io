<!-- Sidebar Visitor Counter via GoatCounter API -->
<script>
  (function () {
    var el = document.getElementById('sidebar-visit-count');
    if (!el) return;

    var id = '{{ site.analytics.goatcounter.id }}';
    if (!id) return;

    /* GoatCounter 공개 카운터 엔드포인트. TOTAL = 사이트 전체 페이지뷰, 인증 불필요 */
    var url = 'https://' + id + '.goatcounter.com/counter/TOTAL.json';

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('API error');
        return res.json();
      })
      .then(function (data) {
        /* count 필드는 서식 문자열(예: "1 234") → 숫자만 추출 */
        var count = parseInt(String(data.count).replace(/\D/g, ''), 10);
        if (isNaN(count)) throw new Error('No data');

        /* 모션 축소 설정 시 스크램블 없이 최종 숫자만 확정 */
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          el.textContent = Number(count).toLocaleString();
          return;
        }

        /* 매트릭스 카운트업 애니메이션 */
        var CHARS    = '0123456789';
        var target   = count.toString();
        var steps    = 16;
        var duration = 800;
        var step     = 0;

        el.style.fontFamily = "'JetBrains Mono', monospace";
        el.style.color      = 'rgba(138, 180, 248, 0.9)';

        var timer = setInterval(function () {
          step++;
          var progress      = step / steps;
          var confirmedFrom = Math.floor(progress * target.length);
          var display       = '';

          for (var i = 0; i < target.length; i++) {
            if (i >= target.length - confirmedFrom) {
              display += target[i];
            } else {
              display += CHARS[Math.floor(Math.random() * CHARS.length)];
            }
          }

          el.textContent = display;

          if (step >= steps) {
            clearInterval(timer);
            el.textContent  = Number(count).toLocaleString();
            el.style.color  = 'var(--text-muted-color)';
          }
        }, duration / steps);
      })
      .catch(function () {
        el.textContent = '–';
      });
  })();
</script>
