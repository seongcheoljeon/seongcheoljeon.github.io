<!-- Mouse Trail Effect -->
<canvas id="trail-canvas" aria-hidden="true"></canvas>

<style>
  #trail-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 99998; /* 커서(99999) 바로 아래 */
    pointer-events: none;
  }
</style>

<script>
  (function () {
    if (navigator.maxTouchPoints > 0 || window.innerWidth <= 1024) return;

    const canvas = document.getElementById("trail-canvas");
    const ctx = canvas.getContext("2d");

    const CONFIG = {
      maxParticles: 60 /* 최대 파티클 수 */,
      spawnRate: 2 /* 마우스 이동 시 프레임당 생성 수 */,
      lifespan: 40 /* 프레임 단위 수명 */,
      minRadius: 0.5,
      maxRadius: 1.0
    };

    let particles = [];
    let mouseX = -999,
      mouseY = -999;
    let isMoving = false;
    let moveTimer;
    let animId = null;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticle(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.6;
      return {
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 0.3 /* 살짝 위로 */,
        radius:
          CONFIG.minRadius +
          Math.random() * (CONFIG.maxRadius - CONFIG.minRadius),
        life: CONFIG.lifespan,
        maxLife: CONFIG.lifespan
      };
    }

    function update() {
      /* 이동 중에만 파티클 생성 */
      if (isMoving) {
        for (let i = 0; i < CONFIG.spawnRate; i++) {
          if (particles.length < CONFIG.maxParticles) {
            particles.push(createParticle(mouseX, mouseY));
          }
        }
      }

      /* 파티클 업데이트 */
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life--;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.02; /* 중력 */
        p.radius *= 0.97;

        if (p.life <= 0 || p.radius < 0.2) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!particles.length) return;

      /* shadowBlur로 글로우 효과 - 프레임당 gradient 객체 생성 없음 */
      ctx.shadowColor = 'rgba(138, 180, 248, 0.8)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(200, 220, 255, 1)';

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const ratio = p.life / p.maxLife;
        ctx.globalAlpha = ratio * 0.85;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function animate() {
      update();
      draw();
      if (particles.length > 0 || isMoving) {
        animId = requestAnimationFrame(animate);
      } else {
        animId = null;
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        if (animId) {
          cancelAnimationFrame(animId);
          animId = null;
        }
      } else if (particles.length > 0 || isMoving) {
        animId = requestAnimationFrame(animate);
      }
    });

    window.addEventListener("mousemove", function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      isMoving = true;
      clearTimeout(moveTimer);
      moveTimer = setTimeout(function () {
        isMoving = false;
      }, 80);
      if (!animId) {
        animId = requestAnimationFrame(animate);
      }
    }, { passive: true });

    window.addEventListener("resize", resize, { passive: true });
    resize();
  })();
</script>
